<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="signup-container">

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Sign in to continue your journey
        </p>

        <form id="signinForm">

            <!-- Email -->
            <div class="form-group">

                <label for="signinEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="signinEmail"
                    placeholder="Enter your registered email"
                    required
                >

                <small
                    id="signinEmailError"
                    class="error">
                </small>

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="signinPassword">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="signinPassword"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('signinPassword')">
                        Show
                    </button>

                </div>

                <small
                    id="signinPasswordError"
                    class="error">
                </small>

            </div>


            <!-- Sign In Button -->
            <button
                type="submit"
                class="signup-btn">

                Sign In

            </button>


            <!-- Signup Link -->
            <p class="login-link">

                Don't have an account?

                <a href="SignUp.html">
                    Sign Up
                </a>

            </p>

        </form>

    </div>


    <script src="index.js"></script>

</body>

</html>
